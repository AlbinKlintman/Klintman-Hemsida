<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klintman</title>
    <meta name="description" content="Klintman - En stilren och minimalistisk presentationssida.">
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Byt språk / Switch language">
        <span class="lang-option active" data-lang="sv">SV</span>
        <span class="lang-divider">|</span>
        <span class="lang-option" data-lang="en">EN</span>
    </button>

    <main class="hero">
        <div class="content-wrapper">
            <h1 id="main-title" class="title">Klintman</h1>
            <p class="description" data-i18n="intro">Välkommen till vår familjedomän som används för mejl.</p>
            <p class="description description-sub" data-i18n="portfolioIntro">För att se våra portfoliosidor kolla här:</p>
            <nav class="links-row">
                <div class="link-item">
                    <a href="https://albinklintman.com/" target="_blank" class="link-button">Albin</a>
                    <span class="link-caption" data-i18n="ownerCaption">Ägare av domänen</span>
                </div>
                <div class="link-item">
                    <a href="https://popklintman.com/" target="_blank" class="link-button">Pop</a>
                </div>
                <div class="link-item">
                    <a href="https://olivialeeklintman.com/" target="_blank" class="link-button">Olivia</a>
                </div>
            </nav>
            <div class="glow"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
